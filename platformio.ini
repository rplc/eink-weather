; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Diese Datei enthaelt KEINE Geheimnisse (WLAN-Zugangsdaten, API-URLs, OTA-Passwoerter).
; Diese werden ueber platformio.local.ini (nicht versioniert, siehe .gitignore)
; im Abschnitt [secrets] definiert und hier per extra_configs eingebunden.

[platformio]
extra_configs =
    platformio.local.ini

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino

monitor_speed = 115200
monitor_filters = esp8266_exception_decoder, time

lib_deps =
    zinggjm/GxEPD2@^1.6.9
    adafruit/Adafruit GFX Library@^1.12.6
    
    bblanchon/ArduinoJson@^7.4.3

build_flags =
    -D WIFI_SSID=\"${secrets.wifi_ssid}\"
    -D WIFI_PASSWORD=\"${secrets.wifi_password}\"
    -D API_URL=\"${secrets.api_url}\"
    -D OTA_HOSTNAME=\"${secrets.ota_hostname}\"
    -D OTA_PASSWORD=\"${secrets.ota_password}\"

; ----------------------------------------------------------------------------
; Upload via USB (Standard-Umgebung, Vererbung fuer die OTA-Umgebung)
; ----------------------------------------------------------------------------
upload_protocol = esptool

; ----------------------------------------------------------------------------
; Zusaetzliche Umgebung fuer OTA-Updates (Over-The-Air)
; Verwendung:  pio run -e d1_mini_ota -t upload
; Die IP/Hostname des Geraets sowie das OTA-Passwort kommen aus
; platformio.local.ini ([secrets] -> OTA_HOSTNAME / OTA_PASSWORD)
; ----------------------------------------------------------------------------
[env:d1_mini_ota]
extends = env:d1_mini
upload_protocol = espota
upload_port = ${secrets.ota_hostname}
upload_flags =
    --auth=${secrets.ota_password}
